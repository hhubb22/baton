<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root { color-scheme: light; --ink:#172f35; --muted:#465f66; --paper:#f4f7f5; --line:#ccd9d3; --accent:#086d61; }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; color:var(--ink); background:var(--paper); font:17px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif; }
a { color:var(--accent); text-underline-offset:.2em; }
a:focus-visible,summary:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
.skip { position:absolute; left:1rem; top:-5rem; background:white; padding:.6rem; }
.skip:focus { top:1rem; }
.shell { max-width:1180px; margin:auto; padding:40px 32px 64px; }
header { padding-bottom:28px; border-bottom:2px solid var(--ink); }
.eyebrow { color:var(--accent); font-size:13px; letter-spacing:.08em; }
h1 { font-size:clamp(28px,4vw,44px); line-height:1.18; max-width:24ch; margin:12px 0 20px; }
h2 { font-size:24px; margin:0 0 16px; line-height:1.35; }
h3 { font-size:18px; margin:0 0 8px; }
p { margin:0 0 14px; }
.baseline { color:var(--muted); font-size:14px; overflow-wrap:anywhere; }
.layout { display:grid; grid-template-columns:minmax(0,1fr) 200px; gap:40px; padding-top:32px; }
main { min-width:0; }
section { scroll-margin-top:24px; margin-bottom:36px; }
nav { position:sticky; top:24px; align-self:start; border-left:1px solid var(--line); padding-left:20px; }
nav a { display:block; margin:10px 0; }
.compare { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
.card { background:white; border:1px solid var(--line); border-radius:12px; padding:20px; min-width:0; }
.label { color:var(--muted); font-size:13px; margin-bottom:8px; }
pre { font-size:14px; line-height:1.6; overflow:auto; padding:18px; border-radius:10px; background:#18353b; color:#edf6f2; }
code { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
svg { display:block; max-width:100%; height:auto; }
details { background:white; border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin:14px 0; }
summary { cursor:pointer; font-weight:600; }
table { width:100%; border-collapse:collapse; margin:14px 0; }
th,td { padding:12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; overflow-wrap:anywhere; }
.table-wrap { overflow-x:auto; }
footer { border-top:1px solid var(--line); padding-top:20px; font-size:14px; color:var(--muted); }
@media(max-width:760px) { .shell { padding:24px 18px 40px; } .layout { display:flex; flex-direction:column; gap:24px; } nav { position:static; order:-1; border-left:0; border-bottom:1px solid var(--line); padding:0 0 16px; width:100%; } nav a { display:inline-block; margin:4px 14px 4px 0; } .compare { grid-template-columns:1fr; } }
@media print { body { background:white; font-size:11pt; } .shell { max-width:none; padding:0; } .layout { display:block; } nav,.skip { display:none; } pre { white-space:pre-wrap; overflow-wrap:anywhere; color:#172f35; background:#eff3f1; } section { break-inside:avoid; } a { color:inherit; } }
@media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
</style>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>
<div class="shell">
<header>
<div class="eyebrow">代码修改说明</div>
<h1>{{TITLE}}</h1>
<p>{{SUMMARY}}</p>
<p class="baseline">{{BASELINE}}</p>
</header>
<div class="layout">
<main id="main">
<section id="problem"><h2>问题与目标</h2><p>{{PROBLEM}}</p></section>
<section id="behavior"><h2>行为变化</h2><div class="compare">
<div class="card"><div class="label">修改前</div><p>{{BEFORE}}</p></div>
<div class="card"><div class="label">修改后</div><p>{{AFTER}}</p></div>
</div></section>
<section id="code"><h2>关键代码与关系</h2>
{{CODE_EXPLANATION}}
<details><summary>查看关键代码或差异</summary><pre><code>{{KEY_CODE}}</code></pre></details>
<p class="baseline">{{CODE_SOURCE}}</p>
</section>
<section id="evidence"><h2>验证证据</h2>{{EVIDENCE}}</section>
<section id="focus"><h2>审阅重点</h2>{{REVIEW_FOCUS}}</section>
<section id="impact"><h2>影响与回退</h2><p>{{IMPACT}}</p></section>
</main>
<nav aria-label="说明导航">
<a href="#problem">问题与目标</a><a href="#behavior">行为变化</a>
<a href="#code">关键代码</a><a href="#evidence">验证证据</a>
<a href="#focus">审阅重点</a><a href="#impact">影响与回退</a>
</nav>
</div>
<footer>{{SOURCES}}</footer>
</div>
</body>
</html>
