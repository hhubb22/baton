  '@effect/platform-node': 4.0.6
  '@effect/sql-pg': 4.0.6
  '@effect/vitest': 4.0.6
  '@effect/openapi-generator': 4.0.6
  typescript: 6.0.3
  vitest: 5.0.5
  eslint: 10.13.0
