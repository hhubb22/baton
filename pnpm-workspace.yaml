packages:
  - e2e
  - apps/*
  - packages/*
  - runtimes/project-agent
  - runtimes/shared
  - web

catalog:
  effect: 4.0.6
  '@effect/platform-node': 4.0.6
  '@effect/sql-pg': 4.0.6
  '@effect/vitest': 4.0.6
  '@effect/openapi-generator': 4.0.6
  typescript: 6.0.3
  vitest: 5.0.5
  prettier: 3.9.10
  '@types/node': 26.6.5
  esbuild: 0.28.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

allowBuilds:
  esbuild: true
  '@google/genai': false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@effect/openapi-generator@4.0.6'
  - '@effect/platform-node@4.0.6'
  - effect@4.0.6
  - '@voidzero-dev/vite-plus-core@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0'
  - vite-plus@1.4.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
