<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>Baton · 设备接入</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          16px/1.7 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      body {
        max-width: 560px;
        margin: 17vh auto;
        padding: 32px;
        color: light-dark(#242424, #ececec);
        background: light-dark(#fafafa, #191919);
      }
      h1 {
        font-size: 32px;
        line-height: 1.3;
        letter-spacing: -1px;
        font-weight: 600;
      }
      p {
        color: light-dark(#626262, #aaa);
      }
      ol {
        padding-left: 24px;
      }
      li {
        padding: 7px 0;
      }
      footer {
        margin-top: 48px;
        font-size: 13px;
        color: light-dark(#737373, #999);
      }
    </style>
  </head>
  <body>
    <h1>连接到你的 Baton 中心</h1>
    <p>请先在浏览器中打开团队的 Baton 中心。</p>
    <ol>
      <li>登录中心，在设备页面点击「在客户端中打开」。</li>
      <li>回到客户端，核对中心地址与证书指纹后确认。</li>
      <li>在中心页面接入这台电脑。</li>
    </ol>
    <footer>关闭窗口后，Baton 会继续留在托盘中运行。可从托盘菜单退出。</footer>
  </body>
</html>
