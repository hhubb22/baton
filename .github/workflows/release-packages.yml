name: Release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: v0.1.0-alpha.1
        type: string

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: win-x64
    services:
      postgres:
        image: ${{ startsWith(matrix.runner, 'ubuntu-') && 'pgvector/pgvector:pg16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: baton
          POSTGRES_DB: baton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baton_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
      BATON_TEST_DATABASE_URL: postgres://postgres:baton@127.0.0.1:5432/baton_test?sslmode=disable
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Check out t3code submodule
        run: git submodule update --init --depth 1 upstream/t3code
      - uses: pnpm/action-setup@v6
        with:
          version: '12.11.2'
      - uses: actions/setup-node@v7
        with:
          node-version: '26.11.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validate version and native target
        run: |
          node --input-type=module -e 'import { releaseTarget } from "./tools/package-release.mjs"; const result = releaseTarget(process.env.RELEASE_VERSION); if (result.target !== process.env.RELEASE_TARGET) throw new Error("Runner architecture does not match release target");'
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Workspace checks
        run: |
          pnpm check
          pnpm typecheck
          node --test tools/*.test.mjs
      - name: Linux workspace tests and server build
        if: runner.os == 'Linux'
        run: |
          pnpm test
          pnpm --filter @baton/server build --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - name: Native node and Runtime tests
        if: runner.os != 'Linux'
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: |
          mkdir -p bin/releases
          set +e
          pnpm --filter @baton/batond test 2>&1 | tee bin/releases/batond-tests.log
          batond_status=$?
          pnpm --dir runtimes/project-agent test 2>&1 | tee bin/releases/project-runtime-tests.log
          runtime_status=$?
          pnpm --filter @baton/desktop test 2>&1 | tee bin/releases/desktop-tests.log
          desktop_status=$?
          if [ "$batond_status" -ne 0 ] || [ "$runtime_status" -ne 0 ] || [ "$desktop_status" -ne 0 ]; then
            exit 1
          fi
      - name: Build native SEA package
        run: |
          mkdir -p bin/releases
          node tools/package-batond.mjs --out bin/package --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" > bin/releases/package-build.json
      - name: Check installed package
        run: node tools/check-package.mjs bin/package > bin/releases/package-check.json
      - name: Measure Worker startup and FULL ledger
        run: node tools/measure/worker-startup.mjs 100 --package bin/package --ledger 2000 > bin/releases/worker-startup.json
      - name: Check Windows process recovery
        if: runner.os == 'Windows'
        run: node tools/verify/windows-processes.mjs > bin/releases/windows-processes.json
      - name: Archive and verify extracted package
        run: node tools/package-release.mjs "$RELEASE_VERSION" bin/package
      - name: Package desktop client
        if: runner.os == 'macOS' || runner.os == 'Windows'
        env:
          electron_config_cache: ${{ runner.temp }}/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder
        run: node tools/package-desktop.mjs --batond bin/package --out bin/releases
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baton-${{ inputs.version }}-${{ matrix.target }}
          path: |
            bin/releases/*.tar.gz
            bin/releases/*.zip
            bin/releases/*.dmg
            bin/releases/*.exe
            bin/releases/*.sha256
            bin/releases/*.json
            bin/releases/*.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
