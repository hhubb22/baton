name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BATON_TEST_DATABASE_URL: postgres://postgres:baton@127.0.0.1:5432/baton_test?sslmode=disable

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: baton
          POSTGRES_DB: baton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baton_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Check out t3code submodule
        run: git submodule update --init --depth 1 upstream/t3code
      - uses: pnpm/action-setup@v4
        with:
          version: '12.11.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.11.1'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            runtimes/project-agent/pnpm-lock.yaml
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Workspace checks
        run: |
          pnpm check
          pnpm typecheck
          pnpm test
      - name: Build
        run: |
          node --test tools/*.test.mjs
          node tools/build.mjs
      - name: Check package
        run: node tools/check-package.mjs bin
      - name: Runtime tests
        run: pnpm --dir runtimes/project-agent test
      - name: Web format
        run: pnpm --dir web format:check
      - name: Web lint
        run: pnpm --dir web lint
      - name: Web typecheck
        run: pnpm --dir web typecheck
      - name: Web unit tests
        run: pnpm --dir web test
