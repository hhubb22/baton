name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BATON_TEST_DATABASE_URL: postgres://postgres:baton@127.0.0.1:55432/baton_test?sslmode=disable

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: baton
          POSTGRES_DB: baton_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baton_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install PostgreSQL 17 tools for private database tests
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17
          /usr/lib/postgresql/17/bin/initdb --version
          echo "BATON_TEST_POSTGRES_BINDIR=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - name: Build
        run: go build ./...
      - name: Cross-build Windows
        run: GOOS=windows go build ./...
      - name: Cross-build macOS
        run: GOOS=darwin go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        id: test
        run: go test -v -count=1 ./...
      - name: Race test
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: go test -race -v -count=1 ./internal/agent/... ./internal/session ./internal/node ./internal/store ./internal/relay ./internal/control

  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
      - uses: ikalnytskyi/action-setup-postgres@v8
        id: postgres
        with:
          postgres-version: '17'
          username: postgres
          password: baton
          database: baton_test
          port: '55432'
      - name: Build
        run: go build ./...
      - name: Vet
        if: ${{ !cancelled() && steps.go.outcome == 'success' && steps.postgres.outcome == 'success' }}
        run: go vet ./...
      - name: Test
        if: ${{ !cancelled() && steps.go.outcome == 'success' && steps.postgres.outcome == 'success' }}
        run: go test -v -count=1 ./...

      - name: Pi sandbox smoke test (no model)
        if: ${{ !cancelled() && matrix.name == 'macOS' }}
        run: go test -v -count=10 ./internal/relay -run '^TestPiSandbox$'

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: baton
          POSTGRES_DB: baton_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baton_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4.2.0
        with:
          version: '12.11.2'
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: E2E tests
        run: pnpm test:e2e
      - name: Check embedded dist
        run: pnpm check:dist
