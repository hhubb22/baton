name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BATON_TEST_DATABASE_URL: postgres://postgres:baton@127.0.0.1:5432/baton_test?sslmode=disable

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: baton
          POSTGRES_DB: baton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baton_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '12.11.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.11.1'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            runtimes/project-agent/pnpm-lock.yaml
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Workspace checks
        run: |
          pnpm check
          pnpm typecheck
          pnpm test
      - name: Build
        run: |
          node --test tools/*.test.mjs
          node tools/build.mjs
      - name: Check sidecar package
        run: node tools/check-sidecar-package.mjs
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        env:
          BATON_TEST_BIN_DIR: ${{ github.workspace }}/bin
          BATON_TEST_NODE_PROJECT_RUNTIME: '1'
        run: go test ./...
      - name: Verify exported protocol fixtures
        run: |
          pnpm --filter @baton/protocol fixtures:export
          pnpm --filter @baton/protocol test
          git diff --exit-code -- packages/protocol/fixtures
      - name: Runtime tests
        run: pnpm --dir runtimes/project-agent test
      - name: Web format
        run: pnpm --dir web format:check
      - name: Web lint
        run: pnpm --dir web lint
      - name: Web typecheck
        run: pnpm --dir web typecheck
      - name: Web unit tests
        run: pnpm --dir web test
