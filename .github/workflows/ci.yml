name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BATON_TEST_DATABASE_URL: postgres://postgres:baton@127.0.0.1:5432/baton_test?sslmode=disable

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: baton
          POSTGRES_DB: baton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baton_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            runtimes/project-agent/pnpm-lock.yaml
      - name: Install Runtime dependencies
        run: pnpm --dir runtimes/project-agent install --frozen-lockfile
      - name: Build
        run: |
          node --test tools/build.test.mjs
          node tools/build.mjs
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        env:
          BATON_TEST_BIN_DIR: ${{ github.workspace }}/bin
          BATON_TEST_NODE_PROJECT_RUNTIME: '1'
        run: go test ./...
      - name: Runtime tests
        run: pnpm --dir runtimes/project-agent test
      - name: Web unit tests
        run: pnpm --dir web test
