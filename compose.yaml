services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: baton
      POSTGRES_USER: baton
      POSTGRES_PASSWORD: ${BATON_POSTGRES_PASSWORD:?设置 BATON_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baton -d baton"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  baton-server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BATON_DATABASE_URL: postgres://baton:${BATON_POSTGRES_PASSWORD:?设置 BATON_POSTGRES_PASSWORD}@postgres:5432/baton?sslmode=disable
      BATON_ALLOWED_ORIGINS: ${BATON_ALLOWED_ORIGINS:?设置公开的 HTTPS Origin}
      BATON_HTTP_ADDR: 0.0.0.0:8080
      BATON_NODE_SIGNING_KEY: /var/lib/baton/node-signing.key
    ports:
      - "${BATON_BIND_ADDR:-127.0.0.1}:${BATON_PORT:-8080}:8080"
    volumes:
      - server-data:/var/lib/baton
    restart: unless-stopped

volumes:
  postgres-data:
  server-data:
